# Render Blueprint: one web service serving the web app, the API and the MCP endpoint.
services:
  - type: web
    name: food-tracker
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: HOST
        value: 0.0.0.0
      - key: TZ
        value: Asia/Bangkok
      - key: DATABASE_URL # Supabase Session pooler connection string
        sync: false
      - key: APP_PASSWORD # password for the web app (12+ characters)
        sync: false
      - key: MCP_SECRET # 32+ random letters/digits; part of the Claude connector URL
        sync: false
